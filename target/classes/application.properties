spring.application.name=attendance-tracker

# File-based H2 DB so data survives restarts (stored in ./data/attendance.mv.db)
spring.datasource.url=jdbc:h2:file:./data/attendance;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console for inspecting data directly, visit http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
